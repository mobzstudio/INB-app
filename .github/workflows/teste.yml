name: Ambiente de teste

on:
  push:
    branches: [main, cursor/maia-agente-marcadores-dc9a]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          GITHUB_PAGES: 'true'
          VITE_MAIA_BROWSER: 'true'
